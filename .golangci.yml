version: "2"

run:
  timeout: 5m
  allow-serial-runners: true

linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - gocyclo
    - godox
    - goprintffuncname
    - govet
    - ineffassign
    - nakedret
    - prealloc
    - rowserrcheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: false
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - nilness
        - shadow
  exclusions:
    paths:
      - frontend/
    rules:
      - path: .*_test\.go
        linters:
          - gocyclo
          - dupl
