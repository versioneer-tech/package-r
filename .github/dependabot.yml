version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      container-images:
        applies-to: version-updates
        # These images use named tags. SemVer filters exclude digest-only updates.
        patterns: ["debian", "distroless/cc-debian13"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/build-candidate]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      hooks:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # uv also reads docs/requirements.txt and tests/requirements.txt.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python-tools:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
