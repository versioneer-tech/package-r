name: Build candidate
description: Build and retain the production binary and OCI image candidate

inputs:
  version:
    description: Candidate version embedded in the binary and image
    required: true
outputs:
  artifact-id:
    description: Immutable candidate artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: frontend/package.json
    - uses: actions/setup-node@v6
      with:
        node-version: "22.x"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - uses: astral-sh/setup-uv@v10
    - uses: docker/setup-buildx-action@v4
    - name: Build release candidate
      shell: bash
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
      run: make candidate VERSION="$CANDIDATE_VERSION" VERSION_HASH="$(git rev-parse --short=7 HEAD)"
    - name: Retain candidate
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/candidate/
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
