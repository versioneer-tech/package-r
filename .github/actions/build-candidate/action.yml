name: Build candidate
description: Build and retain the production binary and OCI image candidate

inputs:
  version:
    description: Candidate version embedded in the binary and image
    required: true
outputs:
  artifact-id:
    description: Immutable candidate artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        package_json_file: frontend/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "22.x"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build release candidate
      shell: bash
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
      run: make candidate VERSION="$CANDIDATE_VERSION" VERSION_HASH="$(git rev-parse --short=7 HEAD)"
    - name: Install image copy tool
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends skopeo
    - uses: ./.github/actions/setup-rclone
    - name: Check the saved production artifacts
      shell: bash
      run: make smoke-candidate
    - name: Retain candidate
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/candidate/
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
