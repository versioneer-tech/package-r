name: Publish packageR
on:
  push:
    tags:
      - 'vnext.[0-9]+.[0-9]+.[0-9]+'
      - 'vnext.[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

jobs:
  verify_release_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Verify full main-branch tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          workflow_runs="$(
            curl --fail --silent --show-error --location --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=main" \
              --data-urlencode "head_sha=${release_commit}" \
              --data-urlencode "status=success" \
              --data-urlencode "per_page=100" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yaml/runs"
          )"

          while IFS= read -r run_id; do
            jobs="$(
              curl --fail --silent --show-error --location \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"
            )"
            if jq -e '
              .jobs as $jobs |
              all(["lint_backend", "lint_frontend", "build", "tests", "required_checks"][];
                  . as $name | any($jobs[]; .name == $name and .conclusion == "success"))
            ' <<<"${jobs}" >/dev/null; then
              exit 0
            fi
          done < <(jq -r --arg commit "${release_commit}" '
            .workflow_runs[] | select(.head_sha == $commit and .head_branch == "main"
              and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")) | .id
          ' <<<"${workflow_runs}")
          printf 'Release commit %s needs a full successful Tests run on main.\n' \
            "${release_commit}" >&2
          printf 'For a documentation-only commit, run Tests manually on main.\n' >&2
          exit 1

  candidate:
    needs: verify_release_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-candidate
        id: candidate
        with:
          version: ${{ github.ref_name }}

  security:
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/security-check.yaml
    with:
      candidate-id: ${{ needs.candidate.outputs.artifact-id }}

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [candidate, security]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: dist/candidate
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.security.outputs.artifact-id }}
          path: build/security
          merge-multiple: true
      - name: Verify the checked artifacts
        run: make security-verify
      - name: Install image copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked image without rebuilding
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-registry-auth
        shell: bash
        run: |
          set -euo pipefail
          manifest=dist/candidate/security-manifest.json
          test "$(jq -r .version "$manifest")" = "$RELEASE_VERSION"
          test "$(jq -r .commit "$manifest")" = "$(git rev-parse HEAD)"
          image="$(jq -r .image "$manifest")"
          expected_digest="$(jq -r .image_digest "$manifest")"
          for tag in "$RELEASE_VERSION-amd64" "$RELEASE_VERSION"; do
            skopeo copy --all --preserve-digests \
              --authfile "$DOCKER_CONFIG/config.json" \
              --digestfile build/published-digest.txt \
              oci-archive:dist/candidate/image.tar "docker://$image:$tag"
            test "$(cat build/published-digest.txt)" = "$expected_digest"
          done

      - name: Pack release security records
        run: tar -czf dist/security-reports.tar.gz -C build/security .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --title "${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            options+=(--prerelease)
          else
            options+=(--latest)
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            dist/candidate/linux-amd64-package-r.tar.gz \
            dist/candidate/security-manifest.json \
            build/security/image.cdx.json \
            build/security/go.cdx.json \
            build/security/frontend.cdx.json \
            dist/security-reports.tar.gz \
            "${options[@]}"

      - name: Publish latest image alias
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-registry-auth
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests \
            --authfile "$DOCKER_CONFIG/config.json" \
            --digestfile build/published-latest-digest.txt \
            oci-archive:dist/candidate/image.tar docker://ghcr.io/versioneer-tech/package-r:latest
          test "$(cat build/published-latest-digest.txt)" = "$(jq -r .image_digest dist/candidate/security-manifest.json)"

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build documentation
        run: make docs

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish versioned documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 || true
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" =~ ^vnext\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            uv run --locked mike deploy --branch gh-pages "${tag}" latest --update-alias --push
            uv run --locked mike set-default --branch gh-pages latest --push
          else
            uv run --locked mike deploy --branch gh-pages "${tag}" --push
          fi
