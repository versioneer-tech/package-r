name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RCLONE_RELEASE_VERSION: "1.75.1"

jobs:
  lint_files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Cache hook tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'go.mod', 'uv.lock') }}

      - name: Run file checks
        run: make lint-files

      - name: Test hook boundaries
        run: make test-tooling

  lint_backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend linters
        run: make lint-backend

  lint_frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend linters and type checks
        run: make lint-frontend

  build:
    # DuckDB needs CGO. Keep the older runner ABI for the release binary.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-candidate
        id: candidate
        with:
          version: snapshot-${{ github.sha }}

  security:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/security-check.yaml
    with:
      candidate-id: ${{ needs.build.outputs.artifact-id }}

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: make test-unit

  rclone_integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: unit
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Restore Sentinel-2 test data
        id: sentinel-cache
        uses: actions/cache@v6
        with:
          path: tests/data/vienna-s2l2a-26
          key: sentinel-2-vienna-${{ runner.os }}-${{ hashFiles('scripts/download_sentinel2.py') }}

      - name: Install integration test dependencies
        run: pip install -r tests/requirements.txt

      - name: Materialize Sentinel-2 test data
        if: steps.sentinel-cache.outputs.cache-hit != 'true'
        run: python scripts/download_sentinel2.py

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/rclone-${RCLONE_RELEASE_VERSION}.zip"
          directory="/tmp/rclone-${RCLONE_RELEASE_VERSION}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused \
            --output "${archive}" \
            "https://github.com/rclone/rclone/releases/download/v${RCLONE_RELEASE_VERSION}/rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64.zip"
          unzip -q "${archive}" -d "${directory}"
          sudo install -m 0755 \
            "${directory}/rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone
          rclone version

      - name: Run local rclone API integration tests
        run: make test-integration

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-race

  go_vulnerabilities:
    permissions:
      contents: read
    uses: ./.github/workflows/go-vulnerabilities.yaml

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Build documentation
        run: make docs
