name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.checks.outputs.docs_only }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks
        id: checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            python3 scripts/ci-checks.py >> "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci-checks.py --base "${BASE_REVISION}" --head "${HEAD_REVISION}" >> "${GITHUB_OUTPUT}"
          fi

  lint_files:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Cache hook tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'go.mod', 'uv.lock') }}

      - name: Run file checks
        run: make lint-files

      - name: Test repository tooling
        if: needs.changes.outputs.docs_only == 'true'
        run: make test-tooling

  lint_backend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend linters
        run: make lint-backend

  lint_frontend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend linters and type checks
        run: make lint-frontend

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-candidate
        id: candidate
        with:
          version: snapshot-${{ github.sha }}

  security:
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/security-check.yaml
    with:
      candidate-id: ${{ needs.build.outputs.artifact-id }}

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --shm-size=1g
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Install build tools
        run: |
          sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install --yes --no-install-recommends build-essential jq pkg-config unzip

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust checkout in the test container
        # Checkout sets safe.directory under a temporary HOME.
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Restore Sentinel-2 test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/data/vienna-s2l2a-26
          key: sentinel-2-vienna-${{ runner.os }}-${{ hashFiles('scripts/download_sentinel2.py') }}

      - uses: ./.github/actions/setup-rclone

      - name: Prepare tests
        run: make setup-tests

      - name: Run all tests
        run: make test

      - name: Save browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  go_vulnerabilities:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/go-vulnerabilities.yaml

  docs:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build documentation
        run: make docs

  required_checks:
    needs: [changes, lint_files, docs, lint_backend, lint_frontend, build, security, tests, go_vulnerabilities]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject missing or failed checks
        if: >-
          needs.changes.result != 'success' ||
          needs.lint_files.result != 'success' ||
          needs.docs.result != 'success' ||
          (needs.changes.outputs.docs_only != 'true' &&
          (needs.lint_backend.result != 'success' || needs.lint_frontend.result != 'success' ||
          needs.build.result != 'success' || needs.security.result != 'success' ||
          needs.tests.result != 'success' || needs.go_vulnerabilities.result != 'success'))
        run: exit 1
