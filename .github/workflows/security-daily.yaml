name: Rescan published releases

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      release-tags:
        description: Published tags to scan, separated by commas; empty selects supported releases
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go_vulnerabilities:
    uses: ./.github/workflows/go-vulnerabilities.yaml

  releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      count: ${{ steps.releases.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Select releases to scan
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ inputs.release-tags }}
        run: |
          set -euo pipefail
          matrix="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            uv run --locked --group tooling python scripts/security.py releases --tags "$RELEASE_TAGS")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  scan:
    needs: releases
    if: needs.releases.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Download published binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: gh release download "$RELEASE_TAG" --pattern linux-amd64-package-r.tar.gz --dir build/release-metadata
      - name: Download published image identity
        if: matrix.manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: gh release download "$RELEASE_TAG" --pattern security-manifest.json --dir build/release-metadata
      - name: Select immutable release identity
        id: release
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          uv run --locked --group tooling python scripts/security.py release-ref \
            --tag "$RELEASE_TAG" --manifest build/release-metadata/security-manifest.json >> "$GITHUB_OUTPUT"
      - name: Get release dependency manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: build/release-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /go.mod
            /go.sum
            /frontend/package.json
            /frontend/pnpm-lock.yaml
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/trivy-cache
          key: trivy-${{ runner.os }}-${{ github.run_id }}-${{ matrix.tag }}
          restore-keys: trivy-${{ runner.os }}-
      - name: Scan published image and release dependencies
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-registry-auth
        run: make security-rescan RELEASE_IMAGE="$RELEASE_IMAGE"
      - name: Retain daily reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/
          retention-days: 90
          if-no-files-found: error
