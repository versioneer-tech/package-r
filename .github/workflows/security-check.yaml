name: Check candidate security

on:
  workflow_call:
    inputs:
      candidate-id:
        type: string
        required: true
    outputs:
      artifact-id:
        value: ${{ jobs.security.outputs.artifact-id }}

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.candidate-id }}
          path: dist/candidate
          merge-multiple: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/trivy-cache
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-${{ runner.os }}-
      - name: Scan candidate and apply security policy
        run: make security
      - name: Retain JSON reports and SBOMs
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/
          retention-days: 90
          if-no-files-found: error
