minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all, --maxkb=1024]
        exclude: ^(tests/data/|img/testdata/)
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
        # TypeScript accepts comments in this file; vue-tsc checks it.
        exclude: ^frontend/tsconfig\.tsc\.json$
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/data/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: python3 scripts/check_secrets.py
        pass_filenames: true
        require_serial: true
        types: [file]
        exclude_types: [symlink]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        exclude: ^tests/data/

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.20.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]

  - repo: local
    hooks:
      - id: lint-backend
        name: Go lint and formatting
        entry: make lint-backend
        language: system
        files: (\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^(Makefile|common\.mk|tools\.mk)$)
        pass_filenames: false
        stages: [pre-commit]
      - id: lint-frontend
        name: Frontend lint and type checks
        entry: make lint-frontend
        language: system
        files: ^frontend/|^(Makefile|common\.mk|tools\.mk)$
        pass_filenames: false
        stages: [pre-commit]
