[project]
name = "package-r-docs"
version = "0.0.0"
description = "Documentation environment for packageR"
requires-python = ">=3.10"
dependencies = [
  "mike==2.2.0",
  "mkdocs-material==9.7.7",
  "openapi-spec-validator==0.9.0",
]

[dependency-groups]
tooling = ["pre-commit==4.7.0", "PyYAML==6.0.3"]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.uv.dependency-groups]
tooling = { requires-python = ">=3.11" }
